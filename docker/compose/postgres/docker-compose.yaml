version: "3.8"

services:
  postgres:
    image: postgres:14.11
    container_name: aptos-postgres
    environment:
      POSTGRES_USER: aptos
      POSTGRES_PASSWORD: aptos123
      POSTGRES_DB: aptos_indexer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptos -d aptos_indexer"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    name: aptos-postgres-data

# How to access PostgreSQL container and query database:
# 1. Enter the container:
#    docker exec -it aptos-postgres bash
#
# 2. Connect to PostgreSQL:
#    psql -U aptos -d aptos_indexer
#
# 3. List all tables:
#    \dt
#
# 4. Query data (example):
#    SELECT * FROM your_table LIMIT 10;
#
# 5. Exit psql:
#    \q
#
# 6. Exit container:
#    exit

# Alternatively, run psql directly without entering the container:
# docker exec -it aptos-postgres psql -U aptos -d aptos_indexer -c "SELECT * FROM your_table LIMIT 10;"
