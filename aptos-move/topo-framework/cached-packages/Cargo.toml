[package]
name = "topo-cached-packages"
description = "Builds framework packages for caching in builds and tests"
version = "0.1.0"

# Workspace inherited keys
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[dependencies]
topo-framework = { workspace = true, optional = true }
aptos-package-builder = { workspace = true, optional = true }
topo-release-bundle = { workspace = true }
aptos-types = { workspace = true }
bcs = { workspace = true }
move-core-types = { workspace = true }
once_cell = { workspace = true }
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }

[features]
default = []
fuzzing = ["proptest", "proptest-derive"]
testing = ["topo-framework", "aptos-package-builder"]

[package.metadata.cargo-machete]
ignored = ["proptest"]
