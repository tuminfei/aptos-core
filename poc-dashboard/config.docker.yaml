# Docker deployment config. This file is mounted to /app/config.yaml by docker-compose.yml.

cluster_dir: "/home/appuser/chain-test-data"

chain:
  # The chain node runs on the Docker host.
  # For a remote chain node, replace host.docker.internal with the server IP or domain.
  rest_url: "http://120.26.182.36:8080/v1"
  chain_id: 164

keys:
  core_resources:
    address: "0xa550c18"
    # The backend prefers cluster_dir/root_key when the cluster data directory is mounted.
    private_key: "0x4E7417A1E2C78E965BE13F0B1F52DEAC3B7743CABAD391093288E6322B3FB05B"

server:
  host: "0.0.0.0"
  port: 38000
  poll_interval_secs: 5

power_writeback:
  enabled: false
  interval_secs: 20
  max_users_per_run: 1000
  max_gas: 400000
  gas_unit_price: 100

frontend:
  host: "0.0.0.0"
  port: 35173
  backend_url: ""

database:
  path: "/app/data/poc_dashboard.db"

test_cluster:
  port_start: 36180
  base_node_count: 4
  target_validator_count: 4
  users_per_new_validator: 1
  power_period_in_epochs: 3
  epoch_duration_secs: 20
  validator_lockup_periods: 2
  governance_voting_periods: 1
  min_validator_stake: 100000000
  validator_stake_multiplier: 100
  user_stake_multiplier: 50
  validator_commission_bps: 10
  validator_force_epochs_after_join: 1
  user_force_epoch: true
  wait_timeout_secs: 180
  poll_interval_secs: 2
