# 集群目录路径（相对于本文件或绝对路径）
# 启动时自动从此目录读取: API地址、chain_id、core_resources 密钥、validator/operator 密钥
cluster_dir: "./poc-validator-cluster"

chain:
  # 留空时后端从 cluster_dir/node.yaml 自动探测；full_flow_bootstrap.sh 从 test_cluster.port_start 派生。
  rest_url: ""
  chain_id: 4

keys:
  core_resources:
    address: "0xa550c18"
    # 本地测试集群默认 root key；生产或共享环境请改为安全注入。
    private_key: "0xD04470F43AB6AEAA4EB616B72128881EEF77346F2075FFE68E14BA7DEBD8095E"

server:
  host: "0.0.0.0"
  port: 38000
  poll_interval_secs: 5

power_writeback:
  enabled: false
  interval_secs: 20
  max_users_per_run: 1000
  max_gas: 400000
  gas_unit_price: 100

frontend:
  host: "0.0.0.0"
  port: 35173
  # 前端开发服务器代理到 Dashboard 后端。留空时由 server.host/server.port 自动派生。
  backend_url: ""

database:
  path: "./poc_dashboard.db"

test_cluster:
  port_start: 36180
  base_node_count: 4
  target_validator_count: 4
  users_per_new_validator: 1
  power_period_in_epochs: 3
  epoch_duration_secs: 20
  validator_lockup_periods: 2
  governance_voting_periods: 1
  min_validator_stake: 100000000
  validator_stake_multiplier: 100
  user_stake_multiplier: 50
  validator_commission_bps: 10
  validator_force_epochs_after_join: 1
  user_force_epoch: true
  wait_timeout_secs: 180
  poll_interval_secs: 2
